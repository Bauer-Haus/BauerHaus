# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This job only reads the tree and uploads it; leaving the token in
          # .git/config would let any later step push with it.
          persist-credentials: false
      - name: Check site size
        # GitHub Pages refuses to publish a site over 1 GB, and every release
        # adds its DMG here. Warn early so old downloads can be moved out
        # before a deploy fails outright.
        run: |
          size_mb=$(du -sm --exclude=.git --exclude=.github . | cut -f1)
          echo "Site size: ${size_mb} MB of the 1024 MB GitHub Pages limit."
          if [ "$size_mb" -ge 1000 ]; then
            echo "::error::Site is ${size_mb} MB; GitHub Pages will reject anything over 1 GB."
            exit 1
          elif [ "$size_mb" -ge 800 ]; then
            echo "::warning::Site is ${size_mb} MB, close to the 1 GB GitHub Pages limit. Move old DMGs out soon."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # v4 began leaving dot-files out of the published site, which would drop
          # /.well-known/security.txt. This restores v3's behavior exactly: dot-files
          # are included, and .git and .github are excluded regardless.
          include-hidden-files: true
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        # GitHub sometimes can't see an artifact for a moment after it's
        # uploaded ("No artifacts named github-pages were found"), which
        # failed run #179. Let this attempt fail softly and try once more.
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
